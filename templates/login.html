<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <title>登入 - 2RTK Ntrip Caster</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #333;
            margin: 0;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .error {
            color: #dc3545;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .field-error {
            border-color: #dc3545 !important;
        }
        .validation-error {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
        }
        .policy-links {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
        }
        .policy-links a {
            color: #4f46a5;
            margin: 0 8px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>2RTK Ntrip Caster</h1>
            <p id="loginMessage">管理員登入</p>
        </div>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        
        <form method="post" id="loginForm" onsubmit="return validateLoginForm(event)">
            <div class="form-group">
                <label>使用者名稱：</label>
                <input type="text" name="username" id="username" required maxlength="50" 
                       oninput="validateUsername()">
                <div id="usernameError" class="validation-error"></div>
            </div>
            <div class="form-group">
                <label>密碼：</label>
                <input type="password" name="password" id="password" required maxlength="100" 
                       oninput="validatePassword()">
                <div id="passwordError" class="validation-error"></div>
            </div>
            <button type="submit" class="btn" id="loginBtn">登入</button>
        </form>
        <nav class="policy-links" aria-label="政策頁面">
            <a href="{{ url_for('terms_of_use') }}">使用條款</a>
            <a href="{{ url_for('privacy_policy') }}">隱私權政策</a>
        </nav>
    </div>
    
    <script>
        let isSubmitting = false;
        
        // 頁面載入時檢查重新導向參數
        window.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const redirectPage = urlParams.get('redirect');
            const messageElement = document.getElementById('loginMessage');
            
            if (redirectPage) {
                const pageNames = {
                    'users': '使用者管理',
                    'mounts': '掛載點管理',
                    'settings': '系統設定'
                };
                const pageName = pageNames[redirectPage] || '管理功能';
                messageElement.textContent = `存取「${pageName}」需要管理員帳號，請先登入。`;
            }
        });
        
        function validateUsername() {
            const input = document.getElementById('username');
            const error = document.getElementById('usernameError');
            const value = input.value.trim();
            
            input.classList.remove('field-error');
            error.textContent = '';
            
            if (value.length === 0) {
                return false;
            }
            
            if (value.length < 3) {
                input.classList.add('field-error');
                error.textContent = '使用者名稱至少需要 3 個字元';
                return false;
            }
            
            if (value.length > 50) {
                input.classList.add('field-error');
                error.textContent = '使用者名稱不得超過 50 個字元';
                return false;
            }
            
            const invalidChars = [' ', '/', '\\', '?', '#', '[', ']', '@', '&', '=', '+', '<', '>', '"', "'"];
            for (let char of invalidChars) {
                if (value.includes(char)) {
                    input.classList.add('field-error');
                    error.textContent = '使用者名稱含有不允許的字元';
                    return false;
                }
            }
            
            return true;
        }
        
        function validatePassword() {
            const input = document.getElementById('password');
            const error = document.getElementById('passwordError');
            const value = input.value.trim();
            
            input.classList.remove('field-error');
            error.textContent = '';
            
            if (value.length === 0) {
                return false;
            }
            
            if (value.length < 6) {
                input.classList.add('field-error');
                error.textContent = '密碼至少需要 6 個字元';
                return false;
            }
            
            if (value.length > 100) {
                input.classList.add('field-error');
                error.textContent = '密碼不得超過 100 個字元';
                return false;
            }
            
            return true;
        }
        
        function validateLoginForm(event) {
            if (isSubmitting) {
                event.preventDefault();
                return false;
            }
            
            const usernameValid = validateUsername();
            const passwordValid = validatePassword();
            
            if (!usernameValid || !passwordValid) {
                event.preventDefault();
                return false;
            }
            
            // 防止重複送出
            isSubmitting = true;
            const submitBtn = document.getElementById('loginBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '登入中...';
            
            setTimeout(() => {
                isSubmitting = false;
                submitBtn.disabled = false;
                submitBtn.textContent = '登入';
            }, 5000);
            
            return true;
        }
    </script>
</body>
</html>
